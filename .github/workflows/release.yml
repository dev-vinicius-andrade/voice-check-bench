name: Desktop release (Windows)

# Push a tag `v<version>` matching package.json (e.g. v2.0.0-alpha.1) to build the
# NSIS installer and publish it as a GitHub Release. A version with a '-' suffix is
# published as a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
      # tauri.release.conf.json turns on createUpdaterArtifacts (only here: without the key that build fails), and
      # the signing key makes Tauri write the updater signature (<setup>.exe.sig) next to the installer.
      - name: Build signed installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --config desktop/src-tauri/tauri.release.conf.json

      - name: Collect installer, checksum, signature and update manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          src=$(ls desktop/src-tauri/target/release/bundle/nsis/*_"${VERSION}"_x64-setup.exe)
          if [ ! -s "${src}.sig" ]; then
            echo "::error::Updater signature ${src}.sig missing; check the TAURI_SIGNING_PRIVATE_KEY secrets"
            exit 1
          fi
          name="VoiceCheckBench-${VERSION}-windows-x64-setup.exe"
          cp "$src" "out/${name}"
          cp "${src}.sig" "out/${name}.sig"
          (cd out && sha256sum "${name}" > "${name}.sha256")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${name}"
          node .github/scripts/updater-manifest.mjs "${VERSION}" "out/${name}.sig" "${url}" out/latest.json \
            "Voice Check Bench ${VERSION}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          ls -l out

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          cat > notes.md <<'NOTES'
          Windows installer for the Voice Check Bench desktop app.

          **Download:** the `-setup.exe` file below. The `.sha256` file holds its checksum. The `.sig` file and `latest.json` are for the app's auto-update.

          The installer is not code-signed yet. Windows SmartScreen may show "Windows protected your PC": click **More info**, then **Run anyway**.

          Pre-releases are work in progress and may be missing features.
          NOTES
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "Voice Check Bench ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag "${flags[@]}"

      # The app's update feed lives on the fixed `updater` release, because GitHub's /releases/latest
      # skips pre-releases. Its latest.json points at the installer of the version release above.
      - name: Publish update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view updater >/dev/null 2>&1; then
            gh release create updater \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "Updater feed (do not download)" \
              --notes "Update feed for the Voice Check Bench desktop app (latest.json). Download the installer from the version releases instead."
          fi
          gh release upload updater out/latest.json --clobber
