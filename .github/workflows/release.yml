name: Desktop release (Windows)

# Push a tag `v<version>` matching package.json (e.g. v2.0.0-alpha.1) to build the
# NSIS installer and publish it as a GitHub Release. A version with a '-' suffix is
# published as a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci

      # Install WDK (Windows Driver Kit) — not pre-installed on GitHub Actions runners.
      # The WDK provides ntddk.h, portcls.h, ksmedia.h and kernel-mode libs needed for driver compilation.
      - name: Install WDK
        shell: pwsh
        run: |
          $wdkNugetUrl = "https://www.nuget.org/api/v2/package/Microsoft.Windows.WDK.x64/10.0.26100.2454"
          $wdkZip = Join-Path $env:TEMP "wdk.nupkg.zip"
          $wdkExtract = Join-Path $env:TEMP "wdk-extracted"

          Write-Host "Downloading WDK NuGet package..."
          Invoke-WebRequest -Uri $wdkNugetUrl -OutFile $wdkZip -UseBasicParsing

          Write-Host "Extracting WDK..."
          Expand-Archive -Path $wdkZip -DestinationPath $wdkExtract -Force

          # Find the build directory containing WindowsDriver.common.targets
          $wdkBuildDir = Get-ChildItem $wdkExtract -Recurse -Filter "WindowsDriver.Common.targets" -ErrorAction SilentlyContinue |
            Select-Object -First 1 | Split-Path -Parent
          if (-not $wdkBuildDir) {
            Write-Host "WARNING: WindowsDriver.Common.targets not found in NuGet package. Listing contents:"
            Get-ChildItem $wdkExtract -Recurse -Depth 3 | Select-Object FullName | Format-Table -AutoSize
            Write-Error "WDK NuGet package does not contain expected build targets."
            exit 1
          }

          # Find Include/km directory for ntddk.h
          $wdkIncludeKm = Get-ChildItem $wdkExtract -Recurse -Directory -Filter "km" -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "ntddk.h") } |
            Select-Object -First 1
          $wdkIncludeBase = if ($wdkIncludeKm) { $wdkIncludeKm.Parent.FullName } else { $null }

          Write-Host "WDK build dir: $wdkBuildDir"
          Write-Host "WDK include base: $wdkIncludeBase"

          # Export as environment variables for subsequent steps
          echo "WDK_BUILD_DIR=$wdkBuildDir" >> $env:GITHUB_ENV
          echo "WDK_INCLUDE_BASE=$wdkIncludeBase" >> $env:GITHUB_ENV

      # Build the virtual audio capture driver with WDK, then inject resources into tauri.conf.json.
      # Driver files are NOT in tauri.conf.json statically (would break push-triggered builds).
      # This step builds them on CI and patches the config before Tauri runs.
      - name: Build virtual audio driver (WDK)
        shell: pwsh
        run: |
          $wdkBuildDir = $env:WDK_BUILD_DIR
          $wdkIncludeBase = $env:WDK_INCLUDE_BASE

          if (-not $wdkBuildDir -or -not (Test-Path $wdkBuildDir)) {
            Write-Error "WDK_BUILD_DIR not set or invalid: $wdkBuildDir"
            exit 1
          }

          # Find SDK version
          $sdkBase = "C:\Program Files (x86)\Windows Kits\10"
          $sdkVersion = Get-ChildItem "$sdkBase\Include" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1 | Select-Object -ExpandProperty Name
          if (-not $sdkVersion) { $sdkVersion = "10.0.26100.0" }
          Write-Host "SDK version: $sdkVersion"
          Write-Host "WDK build dir: $wdkBuildDir"
          Write-Host "WDK include base: $wdkIncludeBase"

          # Locate MSBuild
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" 2>$null | Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            Write-Error "MSBuild not found."
            exit 1
          }
          Write-Host "Using MSBuild: $msbuild"

          $projectFile = Join-Path $PWD "desktop\src-driver\vcb_capture.vcxproj"

          # Set WDK paths as environment variables so Toolset.props reads them natively
          # without MSBuild property quoting/escaping issues that cause MSB4102 illegal path errors.
          $env:WDKContentRoot = $wdkBuildDir
          $env:WindowsSdkDir = $sdkBase
          $env:VCB_WDK_INCLUDE = "$wdkIncludeBase;$wdkIncludeBase\km;$wdkIncludeBase\shared;$wdkIncludeBase\um"
          Write-Host "WDKContentRoot=$env:WDKContentRoot"
          Write-Host "WindowsSdkDir=$env:WindowsSdkDir"
          Write-Host "VCB_WDK_INCLUDE=$env:VCB_WDK_INCLUDE"

          # Use an MSBuild response file for non-path properties only.
          # /noAutoResponse disables the default MSBuild.rsp which contains paths with spaces that conflict.
          $rspFile = Join-Path $env:TEMP "vcb_msbuild.rsp"
          $rspLines = @(
            "`"$projectFile`"",
            "/p:Configuration=Release",
            "/p:Platform=x64",
            "/p:WindowsTargetPlatformVersion=$sdkVersion",
            "/m",
            "/verbosity:normal"
          )
          $rspLines | Set-Content -Path $rspFile -Encoding ASCII

          & $msbuild /noAutoResponse "@$rspFile"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Driver build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          # Copy built artifacts to desktop/src-driver/
          $outputDir = Join-Path $PWD "desktop\src-driver\x64\Release"
          $destDir = Join-Path $PWD "desktop\src-driver"
          $files = @("vcb_capture.sys", "vcb_capture.inf", "vcb_capture.cat")
          foreach ($f in $files) {
            $src = Join-Path $outputDir $f
            if (Test-Path $src) {
              Copy-Item $src $destDir -Force
              Write-Host "Copied $f to $destDir"
            } else {
              Write-Warning "$f not found at $src"
            }
          }

          # Inject resources into tauri.conf.json so Tauri bundles them
          $confPath = Join-Path $PWD "desktop\src-tauri\tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.bundle | Add-Member -NotePropertyName "resources" -NotePropertyValue @(
            "../src-driver/vcb_capture.sys",
            "../src-driver/vcb_capture.inf",
            "../src-driver/vcb_capture.cat"
          ) -Force
          $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath -Encoding UTF8
          Write-Host "Injected driver resources into tauri.conf.json"
      # tauri.release.conf.json turns on createUpdaterArtifacts (only here: without the key that build fails), and
      # the signing key makes Tauri write the updater signature (<setup>.exe.sig) next to the installer.
      - name: Build signed installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --config desktop/src-tauri/tauri.release.conf.json

      - name: Collect installer, checksum, signature and update manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          src=$(ls desktop/src-tauri/target/release/bundle/nsis/*_"${VERSION}"_x64-setup.exe)
          if [ ! -s "${src}.sig" ]; then
            echo "::error::Updater signature ${src}.sig missing; check the TAURI_SIGNING_PRIVATE_KEY secrets"
            exit 1
          fi
          name="VoiceCheckBench-${VERSION}-windows-x64-setup.exe"
          cp "$src" "out/${name}"
          cp "${src}.sig" "out/${name}.sig"
          (cd out && sha256sum "${name}" > "${name}.sha256")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${name}"
          node .github/scripts/updater-manifest.mjs "${VERSION}" "out/${name}.sig" "${url}" out/latest.json \
            "Voice Check Bench ${VERSION}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          ls -l out

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          cat > notes.md <<'NOTES'
          Windows installer for the Voice Check Bench desktop app.

          **Download:** the `-setup.exe` file below. The `.sha256` file holds its checksum. The `.sig` file and `latest.json` are for the app's auto-update.

          The installer is not code-signed yet. Windows SmartScreen may show "Windows protected your PC": click **More info**, then **Run anyway**.

          Pre-releases are work in progress and may be missing features.
          NOTES
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "Voice Check Bench ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag "${flags[@]}"

      # The app's update feed lives on the fixed `updater` release, because GitHub's /releases/latest
      # skips pre-releases. Its latest.json points at the installer of the version release above.
      - name: Publish update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view updater >/dev/null 2>&1; then
            gh release create updater \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "Updater feed (do not download)" \
              --notes "Update feed for the Voice Check Bench desktop app (latest.json). Download the installer from the version releases instead."
          fi
          gh release upload updater out/latest.json --clobber
