name: Desktop release (Windows)

# Push a tag `v<version>` matching package.json (e.g. v2.0.0-alpha.1) to build the
# NSIS installer and publish it as a GitHub Release. A version with a '-' suffix is
# published as a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci

      # Build the virtual audio capture driver with WDK before Tauri bundles it.
      # The compiled .sys/.inf/.cat are placed in desktop/src-driver/ where tauri.conf.json expects them.
      - name: Build virtual audio driver (WDK)
        shell: pwsh
        run: |
          # Find the Windows SDK root (parent of Include/Lib/UnionMetadata, NOT subdirs like WPT)
          $sdkBase = "C:\Program Files (x86)\Windows Kits\10"
          $sdkVersions = Get-ChildItem "$sdkBase\Include" -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "km") } |
            Sort-Object Name -Descending
          if (-not $sdkVersions) {
            Write-Error "No valid Windows SDK version found under $sdkBase\Include"
            exit 1
          }
          $sdkVersion = $sdkVersions[0].Name
          $env:WindowsSdkDir = "$sdkBase\"
          $env:WDKContentRoot = "$sdkBase\"
          $env:WindowsTargetPlatformVersion = $sdkVersion
          Write-Host "SDK version: $sdkVersion"
          Write-Host "WindowsSdkDir: $env:WindowsSdkDir"

          # Locate MSBuild
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" 2>$null | Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            Write-Error "MSBuild not found. Ensure C++ and WDK components are installed."
            exit 1
          }
          Write-Host "Using MSBuild: $msbuild"

          $projectFile = Join-Path $PWD "desktop\src-driver\vcb_capture.vcxproj"

          & $msbuild $projectFile /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=$sdkVersion /p:WDKContentRoot="$env:WDKContentRoot" /p:WindowsSdkDir="$env:WindowsSdkDir" /m /verbosity:normal
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Driver build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          # Copy built artifacts to where tauri.conf.json expects them
          $outputDir = Join-Path $PWD "desktop\src-driver\x64\Release"
          $destDir = Join-Path $PWD "desktop\src-driver"

          $files = @("vcb_capture.sys", "vcb_capture.inf", "vcb_capture.cat")
          foreach ($f in $files) {
            $src = Join-Path $outputDir $f
            if (Test-Path $src) {
              Copy-Item $src $destDir -Force
              Write-Host "Copied $f to $destDir"
            } else {
              Write-Warning "$f not found at $src — driver may not be fully built"
            }
          }

          # Verify all required files exist for Tauri bundling
          $missing = @()
          foreach ($f in $files) {
            if (-not (Test-Path (Join-Path $destDir $f))) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing driver files after build: $($missing -join ', '). Tauri bundle will fail."
            exit 1
          }
          Write-Host "All driver files ready for Tauri bundling."
      # tauri.release.conf.json turns on createUpdaterArtifacts (only here: without the key that build fails), and
      # the signing key makes Tauri write the updater signature (<setup>.exe.sig) next to the installer.
      - name: Build signed installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --config desktop/src-tauri/tauri.release.conf.json

      - name: Collect installer, checksum, signature and update manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          src=$(ls desktop/src-tauri/target/release/bundle/nsis/*_"${VERSION}"_x64-setup.exe)
          if [ ! -s "${src}.sig" ]; then
            echo "::error::Updater signature ${src}.sig missing; check the TAURI_SIGNING_PRIVATE_KEY secrets"
            exit 1
          fi
          name="VoiceCheckBench-${VERSION}-windows-x64-setup.exe"
          cp "$src" "out/${name}"
          cp "${src}.sig" "out/${name}.sig"
          (cd out && sha256sum "${name}" > "${name}.sha256")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${name}"
          node .github/scripts/updater-manifest.mjs "${VERSION}" "out/${name}.sig" "${url}" out/latest.json \
            "Voice Check Bench ${VERSION}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          ls -l out

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          cat > notes.md <<'NOTES'
          Windows installer for the Voice Check Bench desktop app.

          **Download:** the `-setup.exe` file below. The `.sha256` file holds its checksum. The `.sig` file and `latest.json` are for the app's auto-update.

          The installer is not code-signed yet. Windows SmartScreen may show "Windows protected your PC": click **More info**, then **Run anyway**.

          Pre-releases are work in progress and may be missing features.
          NOTES
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "Voice Check Bench ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag "${flags[@]}"

      # The app's update feed lives on the fixed `updater` release, because GitHub's /releases/latest
      # skips pre-releases. Its latest.json points at the installer of the version release above.
      - name: Publish update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view updater >/dev/null 2>&1; then
            gh release create updater \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "Updater feed (do not download)" \
              --notes "Update feed for the Voice Check Bench desktop app (latest.json). Download the installer from the version releases instead."
          fi
          gh release upload updater out/latest.json --clobber
