# Rebuilds public/community/mics.json from the "mic-result" issues and commits it when it changed.
name: Community mic stats

on:
  issues:
    types: [opened, edited, labeled, reopened, closed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: community-mic-stats
  cancel-in-progress: false

jobs:
  aggregate:
    # issue events only matter for issues with the mic-result label
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'mic-result')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Aggregate mic results
        run: npm run community:aggregate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit mics.json if it changed
        run: |
          if git diff --quiet -- public/community/mics.json; then
            echo "public/community/mics.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/community/mics.json
          git commit -m "chore(community): update mic stats"
          git push
