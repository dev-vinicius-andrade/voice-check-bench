# Checks "mic-result" issues (labels + bot comment), then rebuilds public/community/mics.json and commits it
# when it changed. Reactions do not trigger workflows: the schedule picks up new 👍 votes.
name: Community mic stats

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    # mic-result issues only (an unlabeled event still carries the removed label); never react to the bot itself
    if: >-
      github.event_name == 'issues' &&
      github.actor != 'github-actions[bot]' &&
      (contains(github.event.issue.labels.*.name, 'mic-result') || github.event.label.name == 'mic-result')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: community-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # the issue number is passed through env only; issue titles and bodies never reach the shell
      - name: Check the issue
        run: npm run community:review
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aggregate:
    needs: review
    # runs after the review, or alone on schedule / workflow_dispatch (review skipped)
    if: >-
      always() &&
      (needs.review.result == 'success' || needs.review.result == 'skipped') &&
      (github.event_name != 'issues' ||
        contains(github.event.issue.labels.*.name, 'mic-result') || github.event.label.name == 'mic-result')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    concurrency:
      group: community-mic-stats
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Aggregate mic results
        run: npm run community:aggregate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit mics.json if it changed
        run: |
          if git diff --quiet -- public/community/mics.json; then
            echo "public/community/mics.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/community/mics.json
          git commit -m "chore(community): update mic stats"
          git push
