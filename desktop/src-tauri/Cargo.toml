[package]
name = "voice-check-bench-desktop"
version = "0.1.0"
description = "Voice Check Bench desktop app"
edition = "2021"
publish = false

[lib]
name = "voice_check_bench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
