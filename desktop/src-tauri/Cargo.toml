[package]
name = "voice-check-bench-desktop"
version = "0.1.0"
description = "Voice Check Bench desktop app"
edition = "2021"
publish = false

[lib]
name = "voice_check_bench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
# plugin host engine (src/host, src/chain.rs)
vst3 = "0.3"
base64 = "0.23"
libloading = "0.9"
# audio engine (src/audio): WASAPI I/O and lock-free SPSC rings
cpal = "0.18.2"
rtrb = "0.4.1"

[dev-dependencies]
hound = "3.5"
