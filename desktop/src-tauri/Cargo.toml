[package]
name = "voice-check-bench-desktop"
version = "0.1.0"
description = "Voice Check Bench desktop app"
edition = "2021"
publish = false

[lib]
name = "voice_check_bench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
# plugin host engine (src/host, src/chain.rs)
vst3 = "0.3"
base64 = "0.23"
libloading = "0.9"
# audio engine (src/audio): WASAPI I/O and lock-free SPSC rings
cpal = "0.18.2"
rtrb = "0.4.1"
# auto-update from the GitHub Releases feed (JS packages @tauri-apps/plugin-updater/-process pinned to the same versions)
tauri-plugin-updater = "=2.14.1"
tauri-plugin-process = "=2.4.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Devices_Properties"] }

[dev-dependencies]
hound = "3.5"
